services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ceic_catalogo}
      POSTGRES_USER: ${DB_USER:-ceic_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ceic_local_development_only}
    volumes:
      - ceic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ceic_user} -d ${DB_NAME:-ceic_catalogo}"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ceic_catalogo}
      DB_USER: ${DB_USER:-ceic_user}
      DB_PASSWORD: ${DB_PASSWORD:-ceic_local_development_only}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ceic_pgdata: